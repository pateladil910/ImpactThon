<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Safety Shield | Loading Security Gateway...</title>
    
    <!-- WARM CACHE: PRELOAD THE BACKGROUND IMAGE FOR THE DESTINATION PAGES (SIGNUP/INDEX) -->
    <link rel="preload" as="image" href="../images/factory_safety_bg.webp">
    
    <!-- PREMIUM TYPOGRAPHY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #020617;
            --primary-neon: #06b6d4;
            --primary-blue: #3b82f6;
            --safe-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== CINEMATIC PRELOADER CONTAINER ===== */
        #cyber-preloader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .preloader-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .preloader-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(32px, 5.5vw, 64px);
            font-weight: 700;
            letter-spacing: 0.16em;
            color: var(--safe-green);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.45);
            animation: pulseGlow 3s infinite ease-in-out;
            margin-right: -0.16em; /* Compensate for letter-spacing at end of text */
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(16, 185, 129, 0.4); opacity: 0.95; }
            50% { text-shadow: 0 0 35px rgba(16, 185, 129, 0.85); opacity: 1; }
        }

        .preloader-ticker {
            font-family: 'Space Grotesk', monospace;
            font-size: 15px;
            letter-spacing: 0.1em;
            color: var(--primary-neon);
            opacity: 0.85;
            min-height: 24px;
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.35);
        }

        .preloader-footer {
            position: absolute;
            bottom: 80px;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        .preloader-quote {
            font-family: 'Outfit', sans-serif;
            font-style: italic;
            font-size: clamp(14px, 2.2vw, 17px);
            color: var(--text-muted);
            letter-spacing: 0.05em;
            opacity: 0.75;
        }

        .preloader-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.02);
        }

        .preloader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-blue), var(--safe-green));
            box-shadow: 0 0 10px var(--safe-green);
            transition: width 0.08s linear;
        }
    </style>
</head>
<body>

    <!-- CINEMATIC PRELOADER ROUTER PORTAL -->
    <div id="cyber-preloader">
        <div class="preloader-content">
            <h1 class="preloader-title">AI SAFETY SYSTEM</h1>
            <div class="preloader-ticker" id="preloaderTerminal">&gt;_ SYNCING_SATELLITE_FEED...</div>
        </div>
        <div class="preloader-footer">
            <p class="preloader-quote">"Saving what's left. Protecting what's right."</p>
        </div>
        <div class="preloader-bar-container">
            <div class="preloader-bar" id="preloaderBar"></div>
        </div>
    </div>

    <!-- JS MODULE ROUTER SYSTEM -->
    <script type="module">
        import { auth, onAuthStateChanged } from "../js/firebase.js";

        const preloaderTerminal = document.getElementById('preloaderTerminal');
        const preloaderBar = document.getElementById('preloaderBar');

        const terminalLogs = [
            ">_ SYNCING_SATELLITE_FEED...",
            ">_ INITIALIZING_HUMAN_SURVEILLANCE_GRID...",
            ">_ DETECTING_PROXIMITY_OVERRIDE_RELAYS...",
            ">_ CONNECTING_AI_NEURAL_VISION...",
            ">_ COMPILING_ZONE_BOUNDARIES...",
            ">_ SECURE_MAILCLOUD_PORTAL_ACTIVE...",
            ">_ SYSTEM_STATE: SECURED 100%"
        ];

        let logIndex = 0;
        let progress = 0;
        let authStateFetched = false;
        let isLoggedIn = false;
        let assetLoaded = false;

        // 1. Loop simulated boot diagnostic statements
        function printLogs() {
            if (logIndex < terminalLogs.length) {
                preloaderTerminal.textContent = terminalLogs[logIndex];
                logIndex++;
                setTimeout(printLogs, 420);
            }
        }
        printLogs();

        // 2. Track actual window asset loading
        window.addEventListener('load', () => {
            assetLoaded = true;
        });

        // 3. Fetch Firebase Session State
        onAuthStateChanged(auth, (user) => {
            authStateFetched = true;
            isLoggedIn = !!user || localStorage.getItem('isLoggedIn') === 'true';
        });

        // 4. Easing progress bar calculation matched to life cycle
        function updateProgress() {
            if (progress < 85) {
                // Smooth initial incremental boot load
                progress += Math.random() * 2.8 + 1.2;
                preloaderBar.style.width = `${progress}%`;
                setTimeout(updateProgress, 90);
            } else if (progress >= 85 && progress < 100) {
                // Wait for both assets and Firebase auth callback to resolve
                if (assetLoaded && authStateFetched) {
                    progress += 5;
                    preloaderBar.style.width = `${progress}%`;
                    setTimeout(updateProgress, 50);
                } else {
                    // Smooth crawl speed to keep visual alive
                    progress = Math.min(96, progress + 0.15);
                    preloaderBar.style.width = `${progress}%`;
                    setTimeout(updateProgress, 120);
                }
            } else {
                // 100% Loaded! Securely redirect
                preloaderBar.style.width = "100%";
                setTimeout(() => {
                    if (isLoggedIn) {
                        window.location.href = "index.html";
                    } else {
                        window.location.href = "signup.html";
                    }
                }, 500);
            }
        }
        updateProgress();
    </script>
</body>
</html>
