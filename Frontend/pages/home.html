<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Based Smart Safety System</title>
</head>

<body>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* ===== THEME BACKGROUND (MATCHED COLORS) ===== */
    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    /* ===== PAGE CONTAINER ===== */
    .page {
      text-align: center;
      max-width: 900px;
      padding: 40px;
    }

    /* ===== MAIN TITLE ===== */
    .page h1 {
      font-size: clamp(42px, 5vw, 60px);
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 15px;
      color: #FFFFFF;
      text-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    /* ===== SUB TITLE ===== */
    .page h2 {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 400;
      color: #EAF9FD;
      margin-bottom: 35px;
      opacity: 0.9;
    }

    /* ===== BUTTON (ACCENT COLORS) ===== */
    .page button {
      padding: 18px 60px;
      font-size: 20px;
      border: none;
      border-radius: 40px;
      background: #4DE6D6;
      color: #08343D;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      transition: 0.3s ease;
    }

    .page button:hover {
      background: #5FE3D8;
      transform: scale(1.08);
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #00ffd5;
      color: #000;
      border-radius: 25px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 255, 213, 0.4);
    }

    @media (max-width: 768px) {
      .page {
        padding: 20px;
      }
    }
  </style>
  </head>

  <body>

    <div class="page">
      <h1>AI-Based Smart Safety System</h1>
      <h2>Intelligent Industrial Protection</h2>
      <a href="index.html" class="btn">Get Started</a>
    </div>

  </body>

</html>
