<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Danger Analytics | AI Safety</title>

<link rel="stylesheet" href="../css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.chart-container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.chart-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.chart-header h2 {
  color: #00ff9c;
}

input[type="date"] {
  background: #0f172a;
  color: #00ff9c;
  border: 1px solid #00ff9c;
  padding: 6px 10px;
  border-radius: 6px;
}

.chart-box {
  background: rgba(255,255,255,0.05);
  border-radius: 14px;
  padding: 20px;
}

.download-btn {
  background: linear-gradient(135deg,#00ff9c,#00c97f);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.blink {
  color: red;
  font-weight: bold;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,50%,100% { opacity: 1; }
  25%,75% { opacity: 0; }
}

/* 📱 Mobile responsive */
@media(max-width:768px){
  canvas {
    max-height: 300px;
  }
}
</style>
</head>

<body>

<div class="page">

<nav class="navbar">
  <div class="logo">AI Safety</div>
  <ul class="nav-links">
    <li onclick="location.href='dashboard.html'">Dashboard</li>
    <li onclick="location.href='history.html'">History</li>  </ul>
</nav>

<main class="main">
<div class="chart-container">

<div class="chart-header">
  <h2>📊 Hour-Wise Danger Analytics</h2>
  <input type="date" id="dateFilter">
</div>

<div style="margin-bottom:10px;">
  🚨 Current Status:
  <span id="liveStatus" class="blink">WAITING...</span>
</div>

<div class="chart-box">
  <canvas id="dangerChart"></canvas>
</div>

<div style="margin-top:15px; text-align:right;">
  <button onclick="downloadChart()" class="download-btn">
    📥 Download Chart
  </button>
</div>

<a href="dashboard.html" class="history-btn">⬅ Back</a>

</div>
</main>

<footer class="footer">
© 2025 AI Smart Safety System | Analytics
</footer>

</div>

<script>
let chart;

async function loadChart() {
  const date = document.getElementById("dateFilter").value;
  const res = await fetch("http://127.0.0.1:5001/history");
  const data = await res.json();

  const hours = Array(24).fill(0);
  let liveDanger = false;

  data.forEach(item => {
    if (date && item.date !== date) return;

    if (item.status === "DANGER") {
      const hour = parseInt(item.time.split(":")[0]);
      hours[hour]++;
      liveDanger = true;
    }
  });

  document.getElementById("liveStatus").innerText =
    liveDanger ? "DANGER ⚠️" : "SAFE ✅";

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("dangerChart"), {
    type: "bar",
    data: {
      labels: [...Array(24).keys()].map(h => h + ":00"),
      datasets: [{
        label: "Danger Count",
        data: hours,
        backgroundColor: "#ff4d4d"
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: "#00ff9c" } }
      },
      scales: {
        x: { ticks: { color: "#e5e5e5" } },
        y: { ticks: { color: "#e5e5e5" } }
      }
    }
  });
}

function downloadChart() {
  const link = document.createElement("a");
  link.download = "danger-chart.png";
  link.href = chart.toBase64Image();
  link.click();
}

document.getElementById("dateFilter").addEventListener("change", loadChart);
loadChart();
setInterval(loadChart, 5000);
</script>

</body>
</html>
