<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Danger Analytics | AI Safety</title>

<link rel="stylesheet" href="../css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.chart-container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.chart-header h2 {
  color: #00ff9c;
}

.chart-box {
  background: rgba(255,255,255,0.05);
  border-radius: 14px;
  padding: 20px;
  min-height: 400px;
}

canvas {
  min-height: 350px;
}

.download-btn {
  background: linear-gradient(135deg,#00ff9c,#00c97f);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.history-btn {
  display: inline-block;
  margin-top: 15px;
  color: #00ff9c;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="page">

<nav class="navbar">
  <div class="logo">AI Safety</div>
  <ul class="nav-links">
    <li onclick="location.href='index.html'">Home</li>
    <li onclick="location.href='dashboard.html'">Dashboard</li>
    <li onclick="location.href='history.html'">History</li>
  </ul>
</nav>

<main class="main">
<div class="chart-container">

<div class="chart-header">
  <h2>📊 Hour-Wise Danger Analytics</h2>
</div>

<div class="chart-box">
  <canvas id="dangerChart" height="350"></canvas>
</div>

<div style="margin-top:15px; text-align:right;">
  <button onclick="downloadChart()" class="download-btn">
    📥 Download Chart
  </button>
</div>

<a href="history.html" class="history-btn">⬅ Back</a>

</div>
</main>

<footer class="footer">
© 2025 AI Smart Safety System | Analytics
</footer>

</div>

<script>
let chart;

async function loadChart() {
  try {
    const res = await fetch("http://127.0.0.1:5001/api/analytics/hourly");

    if (!res.ok) throw new Error("API not reachable");

    const data = await res.json();
    // Example: { "20": 6 }

    // Create 24-hour labels
    const labels = [...Array(24).keys()].map(h => h + ":00");

    // Fill values, default 0 if hour missing
    const values = labels.map(label => {
      const hour = label.split(":")[0];
      return data[hour] || 0;
    });

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("dangerChart"), {
      type: "bar",
      data: {
        labels: labels,
        datasets: [{
          label: "Danger Count",
          data: values,
          backgroundColor: "#ff4d4d"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            ticks: { stepSize: 1 }
          }
        }
      }
    });

  } catch (err) {
    console.error("Chart load error:", err);
  }
}

function downloadChart() {
  if (!chart) return;
  const link = document.createElement("a");
  link.download = "danger-chart.png";
  link.href = chart.toBase64Image();
  link.click();
}

loadChart();
setInterval(loadChart, 5000);
</script>

</body>
</html>
