<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Detection History | AI Safety</title>
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    /* ===== HISTORY PAGE ONLY ===== */

        .download-btn {
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        margin: 15px 0;
        }
        .download-btn:hover {
        opacity: 0.9;
        }

    .history-container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .history-header h2 {
      color: #00ff9c;
      font-size: 26px;
    }

    .download-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00ff9c, #00c97f);
      color: #003f2e;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .download-btn:hover {
      opacity: 0.85;
    }

    .table-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0, 255, 156, 0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #e5e5e5;
    }

    th {
      text-align: left;
      padding: 14px;
      color: #00ff9c;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 15px;
    }

    tr:hover {
      background: rgba(0, 255, 156, 0.06);
    }

    .badge-danger {
      color: #ff4d4d;
      font-weight: bold;
    }

    .badge-safe {
      color: #00ff9c;
      font-weight: bold;
    }

    .navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
}

.nav-time {
  background: rgba(0, 255, 156, 0.12);
  border: 1px solid rgba(0, 255, 156, 0.35);
  padding: 6px 14px;
  border-radius: 20px;
  color: #00ff9c;
  font-size: 13px;
  backdrop-filter: blur(10px);
}
    .history-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #00ffd5;
      color: #000;
      border-radius: 25px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }
    .history-btn:hover {
      background: #00e6c2;
    }

    .history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.back-clean {
  background: transparent;
  border: 1px solid rgba(0, 255, 156, 0.4);
  color: #00ff9c;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.back-clean:hover {
  background: rgba(0, 255, 156, 0.15);
}


  </style>
</head>

<body>
  <div class="page">

    <!-- NAVBAR -->
    <nav class="navbar">
  <div class="logo">AI Safety</div>

  <ul class="nav-links">
    <li onclick="location.href='dashboard.html'">Dashboard</li>
    <li onclick="location.href='chart.html'">Analytics</li>
    <li onclick="location.href='contact.html'">Contact</li>
  </ul>

  <div class="nav-time">
    ⏱ <span id="liveTime">--:--:--</span>
  </div>

  <button onclick="clearHistory()" class="download-btn" style="background:#ff4d4d;">
      🗑 Clear All Data
  </button>

</nav>

    <!-- MAIN -->
    <main class="main">
      <div class="history-container">

        <div class="history-header">
  <h2>📜 Human Detection History</h2>

  <button class="back-clean" onclick="location.href='dashboard.html'">
    ⬅ Back
  </button>
</div>


        <div class="table-box">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Event</th>
                <th>Status</th>
                <th>Date</th>
                <th>Time</th>
              </tr>
            </thead>

            <tbody id="historyBody"></tbody>
          </table>
        </div>

      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      © 2025 AI Smart Safety System | Detection Logs
    </footer>

  </div>

<script>
async function loadHistory() {
  const tbody = document.getElementById("historyBody");

  try {
    const res = await fetch("http://127.0.0.1:5001/api/history");

    // ❗ backend not ready / route missing
    if (!res.ok) {
      throw new Error("History API not available");
    }

    const data = await res.json();
    tbody.innerHTML = "";

    // ✅ EMPTY DATA HANDLING
    if (data.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center; opacity:0.7;">
            No detection history available
          </td>
        </tr>
      `;
      return;
    }

    // ✅ NORMAL DATA RENDER
    data.forEach((item, index) => {
      tbody.innerHTML += `
        <tr>
          <td>${index + 1}</td>
          <td>${item.Event}</td>
          <td class="${item.Status === 'DANGER' ? 'badge-danger' : 'badge-safe'}">
            ${item.Status}
          </td>
          <td>${item.Date}</td>
          <td>${item.Time}</td>
        </tr>
      `;
    });

  } catch (err) {
    // ✅ graceful fallback (NO console spam)
    tbody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center; opacity:0.6;">
          History service not available
        </td>
      </tr>
    `;
  }
}

/* 🔹 LIVE CLOCK (CURRENT TIME) */
function updateLiveTime() {
  const now = new Date();
  const options = {
    timeZone: "Asia/Kolkata",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  };
  document.getElementById("liveTime").innerText =
    now.toLocaleTimeString("en-IN", options);
}

function downloadExcel() {
  window.location.href = "http://localhost:5001/api/history/download";
}

function clearHistory() {
  if (!confirm("Are you sure you want to clear all detection history?")) return;

  fetch("http://127.0.0.1:5001/api/clear_history", {
    method: "POST"
  })
  .then(() => location.reload())
  .catch(err => console.error(err));
}


setInterval(loadHistory, 5000);
setInterval(updateLiveTime, 1000);

loadHistory();
updateLiveTime();
</script>



</body>
</html>
