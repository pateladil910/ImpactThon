<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login | AI Safety System</title>
    <link rel="stylesheet" href="../css/auth_new.css">
</head>
<body>

<!-- VECTOR HUD TELEMETRY LAYER (BLEEDS THROUGH FROSTED GLASS) -->
<div class="hud-telemetry-layer">
    <!-- Camera Overlay Details -->
    <div class="camera-crosshair">SYS_CAM_04 // LIVE FEED</div>
    
    <!-- Worker Bounding Box Bleading Through Frosted Card -->
    <div class="hud-box worker-box">
        <span class="hud-label">WORKER-03 [AUTHORIZED]</span>
    </div>
    
    <!-- CNC Machine Station Bounding Box Bleading Through Frosted Card -->
    <div class="hud-box cnc-box">
        <span class="hud-label">CNC-STATION [IDLE]</span>
    </div>
</div>

<!-- SEVERE GLASSMORPHISM CARD OVERLAY -->
<div class="auth-card">
    <h2>Agent Login</h2>
    <p class="subtitle">Please enter your details to verify clearance.</p>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username / Email</label>
            <div class="input-wrapper">
                <input id="username" type="text" placeholder="Username / Email" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <input id="password" type="password" placeholder="Password" required>
                <button type="button" class="toggle-btn" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', 'togglePasswordBtn')">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>
        
        <div class="help-links">
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">
            <span class="btn-text">Sign in</span>
            <div class="btn-loader">
                <div class="spinner"></div>
            </div>
        </button>
    </form>
    
    <p class="switch-auth">
        Are you new? 
        <a href="signup_new.html">Create an Account</a>
    </p>
</div>

<!-- Password eye toggle & button loading animation scripts -->
<script>
    function togglePasswordVisibility(inputId, btnId) {
        const passwordInput = document.getElementById(inputId);
        const toggleButton = document.getElementById(btnId);
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleButton.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            `;
        } else {
            passwordInput.type = "password";
            toggleButton.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            `;
        }
    }

    // Interactive form submission feedback
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
            submitBtn.classList.add('loading');
        });
    }
</script>

<!-- Existing Auth Module Integration -->
<script src="../js/auth.js"></script>

</body>
</html>
